services:
  - type: web
    name: kitsune-streaming
    runtime: node
    plan: free
    region: ohio
    branch: main
    buildCommand: npm ci
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kitsune-postgres
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOTP_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://kitsune-streaming.onrender.com
      - key: CLOUDINARY_CLOUD_NAME
        value: oozszqhz
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: kitsune-postgres
    plan: free
    region: ohio
    databaseName: kitsune
    user: kitsune_app
